server:
  # Tailscale Serve publica HTTPS y conecta al backend por loopback.
  address: 127.0.0.1
  port: 8080
  # ActorFilter debe ver la IP del proxy local, no una cabecera del cliente.
  forward-headers-strategy: none
spring:
  application:
    name: papeleria
  datasource:
    # Los DataSource los define DataSourceConfig
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
app:
  db-path: ${PROGRAMDATA:./data}/Papeleria/data/papeleria.db
  # Lista separada por comas; el lanzador carga la variable desde .env.
  allowed-hosts: ${PAPELERIA_ALLOWED_HOSTS:localhost:8080,127.0.0.1:8080}
  local-actor-name: ${COMPUTERNAME:servidor}
management:
  endpoints:
    web:
      exposure:
        include: health
